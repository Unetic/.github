name: Release

on:
  workflow_call:
    inputs:
      package-name:
        required: true
        type: string
      build-kind:
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches project version
        env:
          BUILD_KIND: ${{ inputs.build-kind }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$BUILD_KIND" = rust ]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          else
            version=$(node -p "require('./package.json').version")
          fi
          test "$TAG" = "v$version"

  rust-ci:
    needs: version
    if: inputs.build-kind == 'rust'
    uses: Unetic/.github/.github/workflows/rust-ci.yml@main

  web-ci:
    needs: version
    if: inputs.build-kind == 'web'
    uses: Unetic/.github/.github/workflows/web-ci.yml@main

  package:
    needs: [version, rust-ci, web-ci]
    if: always() && !failure() && !cancelled()
    uses: Unetic/.github/.github/workflows/openwrt-package.yml@main
    with:
      package-name: ${{ inputs.package-name }}
      build-kind: ${{ inputs.build-kind }}

  release:
    needs: package
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish APK to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          apk_files=(artifacts/*.apk)
          test -e "${apk_files[0]}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${apk_files[@]}" --clobber
          else
            gh release create "$TAG" "${apk_files[@]}" --generate-notes --verify-tag
          fi
