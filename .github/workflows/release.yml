name: Release

on:
  workflow_call:
    inputs:
      build-kind:
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches project version
        env:
          BUILD_KIND: ${{ inputs.build-kind }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$BUILD_KIND" = rust ]; then
            version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          else
            version=$(node -p "require('./package.json').version")
          fi

          test "$TAG" = "v$version"

  release:
    needs: version
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --verify-tag
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
